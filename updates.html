<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  @keyframes starSpin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  :root {
    --bg: #3d0808;
    --card-bg: #ede0e0;
    --maroon: #5a0d0d;
    --navy: #1a0a0a;
    --text-dark: #1a1a1a;
    --text-mid: #333;
  }
  .logo {
    position: fixed;
    bottom: 50px;
    left: 20px;
    width: 150px;
    height: 150px;
    z-index: 9999;
    margin-bottom: -100px;
  }
  body {
    background-color: var(--bg);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* navbar */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 56px;
    background: #2a0505;
  }

  .nav-logo {
    height: 72px;
    width: auto;
    object-fit: contain;
    vertical-align: middle;
  }

  .nav-center {
    display: flex;
    align-items: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 400;
    color: #f0e0e0;
    letter-spacing: 0.04em;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .nav-links {
    display: flex;
    flex-direction: row;
    gap: 20px;
    align-items: center;
  }

  .nav-links a {
    display: block;
    padding: 10px 30px;
    background: var(--navy);
    color: #fff;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-decoration: none;
    border-radius: 999px;
    text-align: center;
    transition: opacity 0.2s;
  }

  .nav-links a:hover { opacity: 0.7; }

  .nav-links a.active {
    background: var(--maroon);
  }

  /* page */
  .page {
    padding: 120px 44px 80px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    max-width: 820px;
    margin: 0 auto;
  }

  /* banner */
  .updates-banner {
    width: 100%;
    position: relative;
    overflow: hidden;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .updates-banner img.banner-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.45) saturate(1.2);
  }

  .updates-banner span {
    position: relative;
    z-index: 1;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 3rem;
    font-weight: 600;
    color: #f5eded;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 18px rgba(0,0,0,0.5);
  }

  /* feed */
  .updates-feed {
    padding: 38px 52px 52px;
  }

  .update-post {
    border-top: 1px solid #c9b4b4;
    padding: 28px 0;
  }

  .update-post:last-child {
    border-bottom: 1px solid #c9b4b4;
  }

  .update-date {
    font-family: 'Lato', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--maroon);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .update-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--text-mid);
    line-height: 1.85;
    font-weight: 400;
    max-width: 640px;
  }

  /* mobile */
  @media (max-width: 768px) {
    nav { padding: 14px 16px; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .nav-center { position: static; transform: none; font-size: 1.2rem; order: 0; width: 100%; justify-content: center; }
    .nav-links { order: 1; gap: 6px; justify-content: center; flex-wrap: wrap; width: 100%; }
    .nav-links a { padding: 6px 12px; font-size: 0.68rem; }
    .page { padding: 100px 12px 40px; }
    .updates-feed { padding: 24px 20px 32px; }
    .updates-banner span { font-size: 2rem; }
    .update-body { font-size: 1.05rem; }
  }
</style>

<script>
  /* scroll reveal */
  const revealEls = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  revealEls.forEach(el => observer.observe(el));
</script>
